name: healthcheck
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthcheck endpoint
        run: |
          curl -fsS -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://lex-ai-miniapp.vercel.app/api/cron/healthcheck \
            || echo "healthcheck endpoint unreachable"
