name: writer-daily
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://lex-ai-miniapp.vercel.app/api/cron/writer \
            || echo "writer cron failed"
