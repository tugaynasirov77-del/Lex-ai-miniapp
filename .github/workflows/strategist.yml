name: strategist-weekly
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://lex-ai-miniapp.vercel.app/api/cron/strategist \
            || echo "strategist cron failed"
